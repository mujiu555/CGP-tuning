[project]
name = "cgp-tuning"
version = "0.1.0"
description = "CGP-Tuning: Structure-Aware Soft Prompt Tuning for Code Vulnerability Detection"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Core ML stack (matching README versions)
    "torch>=2.4.0,<2.5.0",
    "transformers>=4.46.0,<4.47.0",
    "trl>=0.11.0,<0.12.0",
    "peft>=0.13.0,<0.14.0",
    # Graph neural network
    "torch-geometric",
    # Graph data structures
    "networkx",
]

[tool.uv]
# All packages default to PyPI; only torch is routed to the CUDA 11.8 index below

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
